name: Context Github

on: 
    push:
    workflow_dispatch:
        inputs:
            name:
                type: string
                required: false
                default: "ceu_azul"

jobs:
    context-github:
        runs-on: ubuntu-latest
        steps:
            - name: Github Context
              env:
                CONTEXT: ${{ toJson(github) }}
              run: echo "$CONTEXT"
            - name: Infos
              env:
                OWNER: ${{ github.repository_owner }}
                SHA: ${{ github.sha }}
              run: |
                echo "Proprietário do Repositório: $OWNER"
                echo "SHA do Commit: $SHA"
        