name: Context Github

on: push

jobs:
    context-github:
        runs-on: ubuntu-latest
        steps:
            - name: Github Context
              env:
                CONTEXT: ${{ toJson(github) }}
              run: echo "$CONTEXT"
            - name: Infos
              run: |
                echo "Proprietário do Repositório: ${{ github.repository_owner }}"
                echo "SHA do Commit: ${{ github.sha }}"
        