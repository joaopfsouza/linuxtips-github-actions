name: Desafio 5 - Meditor de Forca de Senhas

on:
  workflow_dispatch:


jobs:
  lint:
    runs-on: ubuntu-latest
    outputs: 
      isOK: ${{ steps.lint.outputs.isOK }}
    steps:
      
      - uses: actions/checkout@v7
      
      - uses: actions/setup-node@v7
        with:
          version: 20

      - name: Install Deps
        run: npm install --no-audit --no-progress
        working-directory: desafio-5

      - name: Run Lint
        id: lint
        run: |
          npm run lint
          echo "isOK=67" >> "$GITHUB_OUTPUT"
          echo $GITHUB_OUTPUT
        working-directory: desafio-5

  tests:
      runs-on: ubuntu-latest
      needs: lint
      steps:
        
        - uses: actions/checkout@v7
        
        - uses: actions/setup-node@v7
          with:
            version: 20

        - name: Install Deps
          run: npm install --no-audit --no-progress
          working-directory: desafio-5

        - name: Run Test
          env:
            ISOK: ${{ needs.lint.outputs.isOK }}
          run: |

            echo "Qual o numero? $ISOK"
          
            npx jest --runInBand --coverage
            
            ls -lha

          working-directory: desafio-5
