name: Desafio 5 - Meditor de Forca de Senhas

on:
  workflow_dispatch:


jobs:
  lint:
    runs-on: ubunutu-latest
    output: 
      isOK: ${{ steps.lint.output.isOK }}
    steps:
      
      - uses: actions/checkout@v7
      
      - uses: actions/setup-node@v7
        with:
          version: 20

      - name: Install Deps
        run: npm install --no-audit --no-progress
        working-directory: desafio-5

      - name: Run Lint
        id: lint
        run: |
          npm run lint
          echo "isOK='tudo certo'" >> "$GITHUB_OUTPUT"
        working-directory: desafio-5

  tests:
      runs-on: ubunutu-latest
      needs: lint
      steps:
        
        - uses: actions/checkout@v7
        
        - uses: actions/setup-node@v7
          with:
            version: 20

        - name: Run Test
          run: npm install --no-audit --no-progress
          working-directory: desafio-5

        - name: Run Test
          run: |

            echo ${{ needs.lint.ouput.isOK }}
          
            npx jest --runInBand --coverage
          working-directory: desafio-5

