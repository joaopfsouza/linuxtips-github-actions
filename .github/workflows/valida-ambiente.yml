name: Valida Ambiente

on:
    workflow_dispatch:

# global
env:
    NOME_CURSO: GITHUB
jobs:
    valida-ambiente-prd:
        env:
            DIA_DA_SEMANA: sabado
        if: github.ref_name == 'main'
        runs-on: ubuntu-latest
        environment: production
        steps:
            - name: Print Valor
              env:
                DIA_MES: 10
              run: |
                echo "Estou no ambiente ${{ vars.AMBIENTE }}"
                echo "Hoje é dia ${{ env.DIA_MES }}, ${{ env.DIA_DA_SEMANA }}, no curso ${{ env.NOME_CURSO }}"


    valida-ambiente-stg:
        env:
            DIA_DA_SEMANA: domingo
        if: github.ref_name == 'staging'
        runs-on: ubuntu-latest
        environment: staging
        steps:
            - name: Print Valor
              env:
                DIA_MES: 20
              run: |
                echo "Estou no ambiente ${{ vars.AMBIENTE }}"
                echo "Hoje é dia ${{ env.DIA_MES }}, ${{ env.DIA_DA_SEMANA }}, no curso ${{ env.NOME_CURSO }}"

