name: Desafio 01 - Verifica Image Docker

on:
    workflow_dispatch:
        inputs:
            imageTag:
                description: Image type image:tag
                type: string
                required: true


jobs:
    scan_image:
        runs-on: ubuntu-latest
        steps:
            - name: Docker Login
              uses: docker/login-action@v4.6.0
              with:
                username: ${{ var.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_TOKEN }}

            - name: Docker Pull
              run: |
                docker image pull ${{ github.events.input.imageTag }}
            
            - name: Docker Image List
              run: |
                IMAGE_NAME=$(cut ${{ github.events.input.imageTag }} -d ':' -f 1 )
                docker image ls | grep $IMAGE_NAME

            - name: Docker Scout
              uses: docker/scout-action@v1.26.0
              with:
                command:  quickview,cves,recommendations,sbom
                image: ${{ github.events.input.imageTag}}
                only-severities: critical,high

            