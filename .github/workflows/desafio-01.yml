name: Desafio 01

on: 
  workflow_dispatch:
    inputs:
        image:
            description: 'Image name'
            type: string
            required: true
        tag:
            description: 'Image Tag'
            type: string
            required: true

jobs:
    docker_image:
        name: "Pull Image ${{ inputs.image }}:${{ inputs.tag }}"
        runs-on: ubuntu-latest
        steps:

            - run: docker pull ${{ inputs.image }}:${{ inputs.tag }}
              name: Pull Image

            - run: docker image ls
              name: List Images
            
            - name: Docker Login
              uses: docker/login-action@v4.6.0
              with:
                username: ${{ vars.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_TOKEN }}

            - name: Docker Scout
              uses: docker/scout-action@v1.26.0
              with:
                command: cves
                image: ${{ inputs.image }}:${{ inputs.tag }}



