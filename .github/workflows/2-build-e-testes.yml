name: Build e Testes

on:
    workflow_call:
        inputs:
            node_version:
                default: '24'
                required: true
                tyoe: choice
                options:
                    - '24'
                    - '25'
                    - '26'
            fail_pipeline:
                default: false
                type: boolean

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
        - name: Install Depencencias
          run: npm install ${{ inputs.node_version }}
        
        - name: BUild App
          run: echo "npm build app"
        
        - name: Teste
          run: echo "npm test app"

        - name: Pipeline validate
          run: |
            if [[ ${{ inputs.fail_pipeline == "true" }}]]; then
                echo "Pipeline fail"
                exit 1
            else:
                echo "Pipeline success"
          