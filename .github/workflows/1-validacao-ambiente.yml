name: Validação de Ambiente

on:
    workflow_dispatch:
        inputs:
            node_version:
                default: "24"
                type: string
            fail_pipeline:
                type: boolean
                default: false

jobs:
    build_e_testes:
        uses: ./.github/workflows/2-build-e-testes.yml
        with:
            node_version: ${{ github.event.input.node_version }}
            fail_pipeline: ${{ github.event.input.fail_pipeline }}
