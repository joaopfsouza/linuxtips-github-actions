name: Trigger Schedule

on:
  schedule:
    - cron: '47 16 * * *'
    - cron: '*/5 * * * *'

jobs:
  job-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Horário Agendado
        if: github.event.schedule == '47 16 * * *'
        run: echo "Executando schedule, são $(date) UTC"

      - name: Trigger Schedule
        run: echo "Executando schedule, são $(date) UTC - Todos os Crons"