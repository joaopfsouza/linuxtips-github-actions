name: Trigger Pull Request

on:
    pull_request:
        types: [opened, edited, deleted, reopened]
        branches:
            - 'main'
            - 'main*'
            - 'main/**'

jobs:
    pull_request:
        runs-on: ubuntu-latest
        steps:
            - name: Pull Requeste Solicitado
              run: echo "Trigger Pull Request - Pull Request aberto/alterado/deletado/reaberto"